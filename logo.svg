<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon shape -->
  <polygon points="100,10 173.2,55 173.2,145 100,190 26.8,145 26.8,55" 
           fill="url(#logoGradient)" stroke="#1e88e5" stroke-width="2"/>
  
  <!-- CTON text -->
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="40" 
        font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-1">
    CTON
  </text>
  
  <!-- SDK text -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="20" 
        font-weight="500" fill="white" text-anchor="middle" opacity="0.9">
    SDK
  </text>
  
  <!-- Blockchain nodes -->
  <circle cx="70" cy="60" r="5" fill="white" opacity="0.8"/>
  <circle cx="130" cy="60" r="5" fill="white" opacity="0.8"/>
  <circle cx="100" cy="45" r="5" fill="white" opacity="0.8"/>
  <circle cx="70" cy="120" r="5" fill="white" opacity="0.8"/>
  <circle cx="130" cy="120" r="5" fill="white" opacity="0.8"/>
  <circle cx="100" cy="135" r="5" fill="white" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <line x1="70" y1="60" x2="100" y2="45" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="45" x2="130" y2="60" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="60" x2="70" y2="120" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="60" x2="130" y2="120" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="120" x2="100" y2="135" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="135" x2="130" y2="120" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>